[package]
name = "imagelab-ffi"
description = "ImageLab's core for Android: uniffi bindings (Kotlin) over imagelab-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# cdylib: libimagelab_ffi.so in the APK. lib: for host tests.
crate-type = ["cdylib", "lib"]
name = "imagelab_ffi"

[features]
default = ["gpu"]
gpu = ["imagelab-core/gpu"]

[lints]
workspace = true

[dependencies]
imagelab-core = { workspace = true, default-features = false }
uniffi = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
