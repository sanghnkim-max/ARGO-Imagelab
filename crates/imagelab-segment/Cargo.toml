[package]
name = "imagelab-segment"
description = "select + segment areas: PhotoCraft selections and SAM 3 masks (point, box, text concept) with cached embeddings and model management"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["sam3", "mobile-sam", "mobile-sam-gpu"]
# SAM 3 inference (LightCraft's pure-Rust candle port) and its model downloader. Off, every
# segment.* call answers with PhotoCraft's selections ("engine": "photocraft").
sam3 = ["dep:lightcraft-segment", "dep:candle-core", "dep:sha2"]
# MobileSAM (TinyViT encoder, ~10M params, 40.6 MB weights, Apache-2.0) on candle's own
# segment-anything implementation: the phone-sized interactive segmenter for points and boxes.
mobile-sam = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:sha2", "dep:rayon"]
# MobileSAM's encoder on the GPU through wgpu compute (Vulkan on Android, Metal on macOS), the
# same wgpu PhotoCraft renders with; the CPU encoder stays the fallback.
mobile-sam-gpu = ["mobile-sam", "dep:wgpu", "dep:pollster", "dep:bytemuck"]

[lints]
workspace = true

[dependencies]
imagelab-api = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-codecs = { workspace = true }
# Region renders of the open document for the detail pass (render_reduced_rect).
photocraft-compose = { git = "https://github.com/storytold/photocraft", rev = "20fcb6193fcaa1c517d99df2396d0f985593e528" }
photocraft-geom = { git = "https://github.com/storytold/photocraft", rev = "20fcb6193fcaa1c517d99df2396d0f985593e528" }
serde = { workspace = true }
serde_json = { workspace = true }
# SAM 3 on candle (Apache-2.0). Pinned like PhotoCraft: a git dependency at a reviewed rev.
lightcraft-segment = { git = "https://github.com/storytold/lightcraft", rev = "f786b87533e58c6d31c7f9f2897814904448f39a", optional = true }
# The version lightcraft-segment pins (=0.9.2), to read the detector's per-instance masks.
candle-core = { version = "=0.9.2", default-features = false, optional = true }
candle-nn = { version = "=0.9.2", default-features = false, optional = true }
candle-transformers = { version = "=0.9.2", default-features = false, optional = true }
# Verifies a model file the app downloaded itself (segment.installModel); already in the tree via lightcraft-fetch.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "metal"], optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", optional = true }
# The encoder's parallel kernels (src/tiny_vit.rs); the same pool candle's gemm uses.
rayon = { version = "1", optional = true }
sha2 = { version = "0.10", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tempfile = "3"
# Tests that open a document need an authorized workspace.
photocraft-automation = { workspace = true }


[[example]]
name = "gpu_gemm"
required-features = ["mobile-sam-gpu"]
